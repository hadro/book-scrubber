name: Check example shelf

# Weekly check that every example's manifest and images still load, and which
# ones support GIFs (CORS). A failing run means an example needs replacing.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-examples.mjs
